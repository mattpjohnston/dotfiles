# SwayFX only — drop this include on stock Sway
corner_radius 6
smart_corner_radius enable

shadows enable
shadows_on_csd enable
shadow_blur_radius 4
shadow_color #0000002b
shadow_inactive_color #00000014
shadow_offset 0 1

blur enable
blur_xray disable
blur_passes 2
blur_radius 3
blur_noise 0.01
blur_brightness 1.0
blur_contrast 1.0
blur_saturation 1.0

default_dim_inactive 0.02
dim_inactive_colors.unfocused #000000ff
dim_inactive_colors.urgent #900000ff
