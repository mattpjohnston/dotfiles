theme = "current"
[editor]
bufferline = "multiple"
cursorline = true
end-of-line-diagnostics = "hint"
file-picker.hidden = false
text-width = 100

[editor.whitespace.render]
tab = "all"

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.indent-guides]
render = true
character = "▏"
